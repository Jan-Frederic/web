<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Colorful Side</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff6f61 0%, #6a82fb 100%);
            font-family: Arial, sans-serif;
        }
        .sidebar {
            width: 260px;
            height: 100vh;
            background: linear-gradient(120deg, #43cea2 0%, #185a9d 100%);
            color: #fff;
            padding: 40px 20px;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .sidebar h2 {
            margin: 0 0 20px 0;
            font-size: 2em;
            letter-spacing: 2px;
        }
        .sidebar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.1em;
            padding: 10px 0;
            border-radius: 6px;
            transition: background 0.2s;
            display: block;
        }
        .sidebar a:hover {
            background: rgba(255,255,255,0.2);
        }
        .content {
            margin-left: 280px;
            padding: 40px;
            color: #222;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Colorful Side</h2>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </div>
